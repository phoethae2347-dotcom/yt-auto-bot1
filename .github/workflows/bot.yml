name: Generate and review YouTube video

on:
  workflow_dispatch:
  schedule:
    # Once daily; publish one reviewed-by-code educational video per run.
    - cron: "30 0 * * *"

concurrency:
  group: youtube-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore image rotation history
        uses: actions/cache/restore@v4
        with:
          path: state/image-history.json
          key: image-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            image-history-${{ github.ref_name }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install edge-tts
        run: python3 -m pip install --quiet edge-tts

      - name: Install Node packages
        run: npm ci

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UPLOAD_PRIVACY_STATUS: public
          ALLOW_PUBLIC_UPLOAD: "true"
          TTS_VOICE: en-US-JennyNeural
          DEFAULT_LANGUAGE: en
          DEFAULT_AUDIO_LANGUAGE: en-US
          OPENVERSE_USER_AGENT: yt-auto-bot1/1.0 (open-license image downloader; repository owner contact)
        run: node index.js

      - name: Save image rotation history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/image-history.json
          key: image-history-${{ github.ref_name }}-${{ github.run_id }}
